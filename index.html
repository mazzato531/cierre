}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.who) { who = t.dataset.who; save('faveca-who', who); render(); return; }
  if (t.dataset.view) { view = t.dataset.view; render(); return; }
  if (t.dataset.done) {
    var id = decodeURIComponent(t.dataset.done);
    if (done.has(id)) done.delete(id); else done.add(id);
    save('faveca-done', Array.from(done));
    render();
    return;
  }
  if (t.dataset.past) { showPast = !showPast; render(); return; }
  if (t.id === 'next') { sel = t.dataset.goto; cur = sel.slice(0, 7); view = 'mes'; render(); return; }
  if (t.dataset.day) {
    sel = t.dataset.day;
    if (t.dataset.cur) cur = t.dataset.cur;
    render();
    var focusEl = document.querySelector('[data-day="' + sel + '"].cell');
    if (focusEl) focusEl.focus({ preventScroll: true });
    var dayEl = document.getElementById('day');
    if (dayEl && window.innerWidth < 1000) dayEl.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (t.dataset.nav !== undefined) {
    var n = +t.dataset.nav;
    if (n === 0) { sel = TODAY; cur = TODAY.slice(0, 7); }
    else { cur = shiftMonth(cur, n); sel = firstDayOf(cur); }
    render();
    return;
  }
  if (t.dataset.more) { ahead += 45; render(); return; }
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'msel') { cur = ev.target.value; sel = firstDayOf(cur); render(); }
});

render();
</script>

</body></html>
